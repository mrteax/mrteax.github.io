<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tea X 旅行：按大洲浏览国家旅行内容">
  <title>旅行 · Tea X</title>
  <link rel="icon" href="/pack-preview.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/travel.css">
</head>
<body>
  <nav class="nav">
    <a href="/portal.html" class="nav-home">🍵 Tea X</a>
    <span class="nav-title">✈️ 旅行</span>
    <button class="theme-btn" id="themeToggle" aria-label="切换主题">🌙</button>
  </nav>

  <main class="travel-shell">
    <section class="travel-hero">
      <div class="eyebrow">Explore the world</div>
      <h1>旅行</h1>
      <p>从国家入口开始，集中查看签证、预订与逐日行程。</p>
    </section>

    <div class="continent-filters" role="group" aria-label="按大洲筛选">
      <button class="continent-tag active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="continent-tag" type="button" data-filter="europe" aria-pressed="false">欧洲</button>
      <button class="continent-tag" type="button" data-filter="asia" aria-pressed="false">亚洲</button>
      <button class="continent-tag" type="button" data-filter="north-america" aria-pressed="false">北美洲</button>
      <button class="continent-tag" type="button" data-filter="south-america" aria-pressed="false">南美洲</button>
      <button class="continent-tag" type="button" data-filter="africa" aria-pressed="false">非洲</button>
      <button class="continent-tag" type="button" data-filter="oceania" aria-pressed="false">大洋洲</button>
    </div>

    <div class="country-grid" id="countryGrid">
      <a class="content-card country-card" data-continent="europe" href="/france.html">
        <span class="card-emoji" aria-hidden="true">🇫🇷</span>
        <h2>法国</h2>
        <p>巴黎 · 普罗旺斯 · 蔚蓝海岸</p>
        <span class="card-badge">3 个页面</span>
      </a>
    </div>
    <div class="empty-state" id="emptyState" role="status">这个大洲还没有内容</div>
  </main>

  <footer class="footer">Tea X · 旅行</footer>
  <script>
    (() => {
      const tags = document.querySelectorAll('.continent-tag');
      const cards = document.querySelectorAll('.country-card');
      const empty = document.getElementById('emptyState');
      tags.forEach(tag => tag.addEventListener('click', () => {
        const filter = tag.dataset.filter;
        tags.forEach(item => {
          const selected = item === tag;
          item.classList.toggle('active', selected);
          item.setAttribute('aria-pressed', String(selected));
        });
        let visible = 0;
        cards.forEach(card => {
          const show = filter === 'all' || card.dataset.continent === filter;
          card.hidden = !show;
          if (show) visible++;
        });
        empty.style.display = visible ? 'none' : 'block';
      }));
    })();
  </script>
  <script src="/js/travel-theme.js"></script>
  <script src="/js/theme-icons.js"></script>
</body>
</html>
